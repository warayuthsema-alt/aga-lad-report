<html lang="th">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>ตรวจสอบความพร้อมอุปกรณ์ • Smart Maintenance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
@font-face{font-family:Sarabun;src:url(../fonts/sarabun-thai-400-normal.woff2) format("woff2");font-weight:400;unicode-range:U+0E00-0E7F;font-display:swap}
@font-face{font-family:Sarabun;src:url(../fonts/sarabun-thai-700-normal.woff2) format("woff2");font-weight:700;unicode-range:U+0E00-0E7F;font-display:swap}
@font-face{font-family:Sarabun;src:url(../fonts/sarabun-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Sarabun;src:url(../fonts/sarabun-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}

/* ---------- Tokens ---------- */
:root{
  --g:#034832;--g2:#0a6e4b;--lime:#8dc63f;
  --bg:#f2f7f4;--card:#fff;--ink:#0f172a;--mut:#5b6b7c;--line:#d7e6dd;--soft:#eef4f0;--field:#fff;--fieldline:#c4d3cb;
  --ok:#15803d;--okbg:#dcfce7;--ng:#b91c1c;--ngbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--na:#334155;--nabg:#e2e8f0;
  --r:14px;--tap:48px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(3,72,50,.05);
  --safe-b:env(safe-area-inset-bottom,0px);--barh:76px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1511;--card:#13201a;--ink:#e6efe9;--mut:#93a59b;--line:#24362d;--soft:#182a21;--field:#0f1b16;--fieldline:#2f4a3c;
    --g2:#4fc08d;--ok:#4ade80;--okbg:#123222;--ng:#f87171;--ngbg:#3a1717;--warn:#fbbf24;--warnbg:#3a2c0d;--na:#cbd5e1;--nabg:#253241;
    --shadow:none}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Sarabun,'Leelawadee UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
a{color:var(--g2)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Header ---------- */
header{background:var(--g);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--lime);position:sticky;top:0;z-index:6}
header .lg{background:#fff;border-radius:8px;padding:3px 6px;height:38px;display:flex;align-items:center;flex:none}
header .lg img{height:30px;display:block}
header .ttl{min-width:0;flex:1}
header h1{font-size:16px;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{opacity:.8;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{flex:none;min-width:var(--tap);height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;padding:0 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;text-decoration:none}
.hbtn[hidden]{display:none}

/* ---------- Layout ---------- */
main{max-width:640px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-left)) calc(var(--barh) + 24px + var(--safe-b)) max(12px,env(safe-area-inset-right))}
.lay>*+*{margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
h2{font-size:15px;color:var(--g2);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ---------- Status ---------- */
.badge{display:flex;align-items:center;gap:12px;border-radius:12px;padding:14px;font-weight:700;font-size:20px;line-height:1.25}
.badge .ic{font-size:34px;line-height:1}
.badge small{display:block;font-weight:400;font-size:13px;opacity:.9;margin-top:2px}
.ok{background:var(--okbg);color:var(--ok)} .ng{background:var(--ngbg);color:var(--ng)} .wa{background:var(--warnbg);color:var(--warn)} .na{background:var(--nabg);color:var(--na)}
.t{font-size:20px;font-weight:700;margin:2px 0;line-height:1.25}
.code{font-family:ui-monospace,Consolas,monospace;font-size:14px;color:var(--g2);font-weight:700;letter-spacing:.2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14.5px;margin-top:12px}
.kv dt{color:var(--mut)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.chip.ng{background:var(--ngbg);color:var(--ng);border-color:transparent} .chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent} .chip.wa{background:var(--warnbg);color:var(--warn);border-color:transparent}
.it{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--soft);font-size:14.5px}
.it:first-of-type{border-top:none}
.it .n{color:var(--mut);min-width:22px}
.it .x{flex:1;min-width:0}
.it .x small{display:block;color:var(--mut);font-size:12.5px}
.pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.rd{font-size:14px;padding:9px 0;border-top:1px solid var(--soft)} .rd:first-of-type{border-top:none}
.rd b{color:var(--g2)}
.pend{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.mut{color:var(--mut);font-size:13px}
.center{text-align:center}
.err{background:var(--ngbg);color:var(--ng);padding:12px;border-radius:10px}
details.more summary{cursor:pointer;color:var(--g2);font-weight:700;font-size:14px;padding:10px 0 2px;list-style:none;min-height:var(--tap);display:flex;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{display:none}

/* ---------- Buttons / bar ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:none;border-radius:12px;padding:12px 14px;font-weight:700;font-size:17px;text-decoration:none}
.btn.p{background:var(--g);color:#fff} .btn.s{background:var(--card);color:var(--g2);border:2px solid currentColor}
@media (prefers-color-scheme:dark){.btn.p{background:#0d7a52}}
.btn:disabled{opacity:.55}
.btn:active{transform:translateY(1px)}
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right)) calc(10px + var(--safe-b)) max(12px,env(safe-area-inset-left));z-index:5}
.bar .in{max-width:640px;margin:0 auto}
.row{display:flex;gap:8px}
.prog{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--mut);margin-bottom:8px}
.prog .tr{flex:1;height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.prog b{color:var(--ink)}

/* ---------- Form ---------- */
.items{display:grid;gap:0}
.q{padding:12px 0;border-top:1px solid var(--soft);scroll-margin-top:80px}
.q:first-child{border-top:none}
.q b{font-size:15.5px} .q small{display:block;color:var(--mut);font-size:13px}
.q.miss{background:linear-gradient(90deg,var(--warnbg),transparent);border-radius:8px;padding-left:8px;margin-left:-8px}
.seg{display:flex;gap:8px;margin-top:8px}
.seg button{flex:1;min-height:var(--tap);border:2px solid var(--line);background:var(--field);border-radius:10px;padding:8px 4px;font-weight:700;font-size:16px;color:var(--mut)}
.seg button[aria-pressed=true].g{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed=true].r{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
.qcam{display:none;margin-top:8px;font-size:13.5px;color:var(--ng);font-weight:700;background:none;border:1px dashed var(--ng);border-radius:10px;padding:8px 10px;min-height:40px}
.q.bad .qcam{display:inline-flex;align-items:center;gap:6px}
.allok{border:none;background:var(--okbg);color:var(--ok);font-weight:700;font-size:14px;border-radius:999px;padding:0 14px;min-height:40px}
label.f{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--fieldline);border-radius:10px;background:var(--field);color:var(--ink);min-height:var(--tap)}
textarea{resize:vertical}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph>div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--nabg)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.62);color:#fff;font-size:16px;line-height:32px;padding:0}
.ph .add{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--g2);background:var(--soft);color:var(--g2);font-weight:700;font-size:13px;width:100%;height:100%;border-radius:10px}
.ph .add{gap:4px}.ph .add span{font-size:28px;line-height:1.2}
.ph2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ph2 a{width:64px;height:64px;border-radius:8px;overflow:hidden;display:block;background:var(--nabg)}
.ph2 img{width:100%;height:100%;object-fit:cover}
.draft{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:8px}
.draft button{border:none;background:none;color:var(--g2);font-weight:700;min-height:40px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9;flex-direction:column;gap:12px;color:#fff;padding:20px}
#zoom img{max-width:100%;max-height:72vh;border-radius:8px}
#zoom a{color:#bef264;font-weight:700}

/* ---------- List ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats button{border:2px solid transparent;border-radius:12px;padding:10px 4px;font-weight:700;font-size:22px;line-height:1.1;min-height:64px}
.stats button small{display:block;font-weight:400;font-size:12.5px;margin-top:2px}
.stats button[aria-pressed=true]{border-color:currentColor}
.ls a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;min-height:56px;border-top:1px solid var(--soft);color:inherit;text-decoration:none}
.ls a:first-child{border-top:none}
.ls a:active{background:var(--soft)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.groups{display:grid;gap:12px}
.groups .card{margin:0}
.search{position:relative;margin-top:12px}
.search input{padding-left:40px}
.search span{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--g2);border-radius:50%;animation:s 1s linear infinite;margin:40px auto}
@keyframes s{to{transform:rotate(360deg)}}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.foot{margin-top:14px}

/* ---------- โทรศัพท์แนวนอน / จอเตี้ย ---------- */
@media (max-height:500px) and (orientation:landscape){
  header{padding-top:4px;padding-bottom:4px} header .lg{height:30px} header .lg img{height:22px} header small{display:none}
  .badge{padding:10px} .badge .ic{font-size:26px}
  :root{--barh:64px}
  .btn{min-height:46px}
}
/* ---------- จอเล็กมาก ---------- */
@media (max-width:359px){
  .kv{grid-template-columns:1fr;gap:0 0} .kv dt{margin-top:6px;font-size:13px}
  .stats{grid-template-columns:repeat(2,1fr)}
  header h1{font-size:15px}
}
/* ---------- แท็บเล็ต ---------- */
@media (min-width:700px){
  main{max-width:860px;padding-top:18px}
  .bar .in{max-width:860px}
  .items{grid-template-columns:1fr 1fr;column-gap:20px}
  .items .q:nth-child(2){border-top:none}
  .ph{grid-template-columns:repeat(6,1fr)}
  .groups{grid-template-columns:1fr 1fr;align-items:start}
  .t{font-size:22px}
}
/* ---------- คอมพิวเตอร์ / แท็บเล็ตแนวนอน: 2 คอลัมน์ ---------- */
@media (min-width:1024px){
  main{max-width:1180px;padding-bottom:32px}
  .lay{display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px;align-items:start;grid-auto-flow:row dense}
  .lay>*+*{margin-top:0}
  .lay>.side{grid-column:1;position:sticky;top:76px}
  .lay>.main{grid-column:2;grid-row:1 / span 50}
  .lay>.main>.card+.card,.lay>.side>.card+.card{margin-top:16px}
  .bar{position:static;background:none;backdrop-filter:none;border:none;padding:0;margin-top:12px}
  .bar .in{max-width:none}
  .side .bar{display:block}
  .ph{grid-template-columns:repeat(3,1fr)}
  .groups{grid-template-columns:repeat(3,1fr)}
  .stats{max-width:560px}
  .lsHead{display:flex;gap:16px;align-items:center}
  .lsHead .search{flex:1;margin-top:0}
}
@media (hover:hover){
  .ls a:hover{background:var(--soft)}
  .btn.p:hover{filter:brightness(1.08)}
  .seg button:hover{border-color:var(--fieldline)}
}
@media print{header,.bar,.hbtn{display:none}main{max-width:none;padding:0}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header>
  <a class="hbtn" id="back" href="./" hidden aria-label="กลับไปรายการอุปกรณ์">‹ รายการ</a>
  <div class="lg"><img src="../img/logo.png" alt="Advance Group Asia"></div>
  <div class="ttl"><h1 id="htitle">ตรวจสอบความพร้อมอุปกรณ์</h1><small>Smart Maintenance • สาขาลาดพร้าว</small></div>
</header>
<main id="app" aria-live="polite"><div class="lay"><div class="skel"></div><div class="skel"></div></div></main>
<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>
<script>
"use strict";
const SB = "https://zhdigumxkjfvrkkmqqpk.supabase.co/rest/v1/";
const KEY = "sb_publishable_MTkVxwcz5UOVcnXJ4i1WBQ_QllM4MuY";
const H = { apikey: KEY, Authorization: "Bearer " + KEY };
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TM = ["", "ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
const thd = s => { if (!s) return "-"; const [y, m, d] = s.slice(0, 10).split("-").map(Number); return d + " " + TM[m] + " " + (y + 543 - 2500); };
const ageText = iso => {
  const [y, m, d] = iso.slice(0, 10).split("-").map(Number), t = new Date(Date.now() + 7 * 3600e3);
  let mo = (t.getUTCFullYear() - y) * 12 + (t.getUTCMonth() + 1 - m); if (t.getUTCDate() < d) mo--;
  if (mo <= 0) return "ไม่ถึง 1 เดือน";
  const yy = Math.floor(mo / 12), mm = mo % 12;
  return (yy ? yy + " ปี" : "") + (yy && mm ? " " : "") + (mm ? mm + " เดือน" : "");
};
const todayISO = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
const daysTo = iso => Math.round((Date.parse(iso.slice(0, 10)) - Date.parse(todayISO())) / 864e5);
const dueText = iso => { if (!iso) return ""; const n = daysTo(iso); return n > 0 ? "อีก " + n + " วัน" : n === 0 ? "ครบกำหนดวันนี้" : "เกินกำหนด " + (-n) + " วัน"; };
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} };
const wide = matchMedia("(min-width:1024px)");
const ST = {
  ready: ["ok", "✅", "พร้อมใช้งาน"], broken: ["ng", "⛔", "ชำรุด / ไม่พร้อมใช้งาน"],
  overdue: ["wa", "⏰", "เกินกำหนดตรวจ"], nodata: ["na", "❔", "ยังไม่มีผลตรวจ"]
};
async function get(path) {
  const r = await fetch(SB + path, { headers: H });
  if (!r.ok) throw new Error("โหลดข้อมูลไม่สำเร็จ (" + r.status + ")");
  return r.json();
}
const qs = new URLSearchParams(location.search);
const assetKey = qs.get("a");
let asset, tpl, people = [], pending = [], GAS = "";
const PHOTO_KEY = "sm-photo-2569", MAX_PH = 6, MIN_PH = 1;

// แถบปุ่มล่าง: มือถือ/แท็บเล็ต = ติดขอบล่าง (นิ้วโป้งเอื้อมถึง), คอมพิวเตอร์ = อยู่ในคอลัมน์ซ้าย
function placeBar() {
  const bar = $("#bar"), slot = $("#barSlot");
  if (wide.matches && slot) { if (bar.parentNode !== slot) slot.appendChild(bar); }
  else if (bar.parentNode !== document.body) document.body.appendChild(bar);
}
wide.addEventListener ? wide.addEventListener("change", placeBar) : wide.addListener(placeBar);
// เปลี่ยนเนื้อหา: ย้ายแถบปุ่มกลับมาที่ body ก่อน เพื่อไม่ให้ถูกลบไปพร้อมเนื้อหาเดิม
const APP = { set html(v) { const bar = $("#bar"); if (bar.parentNode !== document.body) document.body.appendChild(bar); $("#app").innerHTML = v; } };
function setBar(html) {
  $("#barIn").innerHTML = html; $("#bar").hidden = !html; placeBar();
  // เว้นที่ด้านล่างให้พอดีกับความสูงแถบปุ่ม (ไม่ให้บังเนื้อหา)
  requestAnimationFrame(() => { $("#app").style.paddingBottom = !wide.matches && html ? ($("#bar").offsetHeight + 20) + "px" : ""; });
}
addEventListener("resize", () => { if (!$("#bar").hidden) $("#app").style.paddingBottom = !wide.matches ? ($("#bar").offsetHeight + 20) + "px" : ""; });

async function main() {
  try {
    if (!assetKey) return listView();
    $("#back").hidden = false;
    const [a, p] = await Promise.all([
      get("sm_assets?asset_key=eq." + encodeURIComponent(assetKey) + "&select=*"),
      get("sm_people?select=name,role&order=name"),
      get("sm_config?k=eq.public_gas_url&select=v").then(r => { GAS = (r[0] && r[0].v) || ""; }).catch(() => {})
    ]);
    if (!a.length) { APP.html = `<div class="card err">ไม่พบอุปกรณ์รหัส <b>${esc(assetKey)}</b><br><small>ให้แอดมินกด "ซิงก์ออนไลน์" ในโปรแกรม Smart Maintenance แล้วสแกนใหม่</small></div><p class="center"><a href="./">ดูรายการอุปกรณ์ทั้งหมด</a></p>`; return; }
    asset = a[0]; people = p;
    const [t, pd] = await Promise.all([
      get("sm_templates?template_id=eq." + encodeURIComponent(asset.template_id) + "&select=*"),
      get("sm_submissions?asset_key=eq." + encodeURIComponent(assetKey) + "&select=id,insp_date,inspector,results,photos,created_at&order=created_at.desc")
    ]);
    tpl = t[0] || { title: asset.category, items: [], mode: "normal" }; pending = pd;
    const dr = draftGet();
    if (qs.get("f") === "1" || (dr && Date.now() - (dr.ts || 0) < 30 * 60e3)) formView(); else statusView();
  } catch (e) { APP.html = `<div class="card err">${esc(e.message)}<br><small>ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่</small><p><button class="btn s" onclick="location.reload()">ลองใหม่</button></p></div>`; }
}

function lab(v) {
  const have = tpl && tpl.mode === "have";
  if (v === "normal") return `<span class="pill ok">${have ? "มี" : "ปกติ"}</span>`;
  if (v === "abnormal") return `<span class="pill ng">${have ? "ไม่มี" : "ไม่ปกติ"}</span>`;
  return `<span class="pill na">-</span>`;
}

function phStrip(ph) {
  if (!ph || !ph.length) return "";
  return `<div class="ph2">${ph.map(p => `<a href="#" data-t="${esc(p.t)}" data-u="${esc(p.u || "")}" aria-label="ดูรูปตรวจเช็ค"><img src="${esc(p.t)}" alt="" loading="lazy"></a>`).join("")}</div>`;
}
function bindZoom() {
  $$(".ph2 a").forEach(a => a.onclick = ev => {
    ev.preventDefault();
    const z = document.createElement("div"); z.id = "zoom"; z.setAttribute("role", "dialog");
    z.innerHTML = `<img src="${esc(a.dataset.t)}" alt="รูปตรวจเช็ค"><div>${a.dataset.u ? `<a href="${esc(a.dataset.u)}" target="_blank" rel="noopener">เปิดภาพต้นฉบับ (Google Drive)</a>` : "ภาพย่อสำหรับแสดงผล"}</div><div style="color:#ccc;font-size:13px">แตะเพื่อปิด</div>`;
    z.onclick = e => { if (e.target.tagName !== "A") z.remove(); };
    document.body.appendChild(z);
  });
}

// ---------- รูปถ่าย: ย่อเป็นภาพเล็กสุดสำหรับ Supabase, ต้นฉบับส่ง Google Drive ----------
function loadImg(file) {
  return new Promise((ok, no) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("เปิดรูปไม่ได้")); i.src = u; });
}
function draw(img, max) {
  const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.naturalWidth * r)); c.height = Math.max(1, Math.round(img.naturalHeight * r));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c;
}
async function makeThumb(file) {
  const img = await loadImg(file);
  const c = draw(img, 200);
  let d = c.toDataURL("image/webp", 0.4);
  if (!d.startsWith("data:image/webp")) d = c.toDataURL("image/jpeg", 0.45);
  return { img, thumb: d };
}
const toB64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => no(r.error); r.readAsDataURL(blob); });
async function original(p) {
  // เก็บไฟล์ต้นฉบับ; ถ้าใหญ่เกิน 12 MB หรือเป็นชนิดที่เบราว์เซอร์อ่านไม่ได้ จึงแปลงเป็น JPEG คุณภาพสูง
  const f = p.file, type = f.type || "image/jpeg";
  if (f.size <= 12 * 1024 * 1024 && /^image\/(jpeg|png|webp|heic|heif)$/.test(type)) return { mime: type, data: await toB64(f) };
  const c = draw(p.img, 4000);
  const b = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.92));
  return { mime: "image/jpeg", data: await toB64(b) };
}
async function uploadOriginal(p, n, insp) {
  const o = await original(p);
  const r = await fetch(GAS, { method: "POST", body: JSON.stringify({ key: PHOTO_KEY, date: todayISO(), code: asset.asset_code, name: asset.name, inspector: insp, n, mime: o.mime, data: o.data }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "อัปโหลดไม่สำเร็จ");
  return j;
}

        <p class="mut">ผลตรวจจะเข้าโปรแกรมเมื่อแอดมินกด "ซิงก์ออนไลน์" แล้วหัวหน้างานลงนาม</p></div>`;
      $("#app").insertAdjacentHTML("beforeend", `<div id="barSlot" style="max-width:560px;margin:12px auto 0"></div>`);

  const col = { ready: "var(--ok)", broken: "var(--ng)", overdue: "var(--warn)", nodata: "#94a3b8" };
  const cnt = k => list.filter(a => a.status === k).length;
  let filt = "", q = "";
  const draw = () => {
    const g = {};
    list.filter(a => (!filt || a.status === filt) && (!q || (a.asset_code + a.name + a.category + (a.location || "")).toLowerCase().includes(q.toLowerCase())))
      .forEach(a => (g[a.category] = g[a.category] || []).push(a));
    $("#ls").innerHTML = Object.keys(g).map(c => `<section class="card"><h2>${esc(c)} <span class="mut">${g[c].length}</span></h2><div class="ls">${g[c].map(a => `<a href="?a=${encodeURIComponent(a.asset_key)}"><span style="display:flex;gap:10px;align-items:center;min-width:0"><span class="dot" style="background:${col[a.status] || "#94a3b8"}" title="${esc((ST[a.status] || ST.nodata)[2])}"></span><span style="min-width:0"><span class="code">${esc(a.asset_code)}</span><br><span style="font-size:14.5px">${esc(a.name)}</span>${a.location ? `<br><span class="mut">📍 ${esc(a.location)}</span>` : ""}</span></span><span class="mut" style="white-space:nowrap">${thd(a.last_date)} ›</span></a>`).join("")}</div></section>`).join("") || "<p class='mut center'>ไม่พบอุปกรณ์</p>";
    $$(".stats button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === filt)));
  };
  const stat = (k, cls, label) => `<button type="button" class="${cls}" data-s="${k}" aria-pressed="false">${cnt(k)}<small>${label}</small></button>`;
  APP.html = `<section class="card"><div class="lsHead"><div class="stats">${stat("ready", "ok", "พร้อมใช้")}${stat("broken", "ng", "ชำรุด")}${stat("overdue", "wa", "เกินกำหนด")}${stat("nodata", "na", "ไม่มีผล")}</div>
    <div class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="ค้นหารหัส / ชื่อ / สถานที่" aria-label="ค้นหาอุปกรณ์" enterkeyhint="search"></div></div>
    <div class="mut" style="margin-top:8px">แตะตัวเลขเพื่อกรองสถานะ • ทั้งหมด ${list.length} รายการ</div></section><div class="groups" id="ls" style="margin-top:12px"></div>`;
  $$(".stats button").forEach(b => b.onclick = () => { filt = filt === b.dataset.s ? "" : b.dataset.s; buzz(); draw(); });
  $("#q").oninput = e => { q = e.target.value; draw(); };
  draw();
}
main();
</script>
</body>
</html>
